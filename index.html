<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayad Po Muna Plsss :(</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 30px;
      position: relative;
    }

    /* Rainbow text */
    .message {
      font-size: clamp(28px, 5vw, 55px);
      font-weight: 900;
      margin-bottom: 30px;

      background: linear-gradient(
        90deg,
        #ff0000,
        #ff7a00,
        #ffff00,
        #00ff00,
        #00ffff,
        #008cff,
        #8a2be2,
        #ff00ff,
        #ff0000
      );

      background-size: 400% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: rainbow 4s linear infinite;

      filter:
        drop-shadow(0 0 8px rgba(255, 0, 255, 0.4))
        drop-shadow(0 0 15px rgba(0, 255, 255, 0.25));
    }

    @keyframes rainbow {
      to {
        background-position: 400% center;
      }
    }

    /* GIF frame */
    .cat-frame {
      width: min(480px, 85vw);
      height: min(480px, 85vw);

      margin: auto;
      padding: 6px;

      border-radius: 24px;

      background: linear-gradient(
        135deg,
        #ff004c,
        #ff8a00,
        #ffee00,
        #00ff88,
        #00c8ff,
        #8a2be2,
        #ff00c8
      );

      background-size: 300% 300%;
      animation: borderGlow 5s ease infinite;

      box-shadow:
        0 0 20px rgba(255, 0, 128, 0.35),
        0 0 50px rgba(0, 200, 255, 0.2);
    }

    .cat {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 18px;
      display: block;
      background: #000;
    }

    @keyframes borderGlow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Decorative floating dots */
    .dot {
      position: fixed;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: white;
      opacity: 0.7;
      animation: float 5s ease-in-out infinite;
    }

    .dot:nth-child(1) { top: 15%; left: 12%; }
    .dot:nth-child(2) { top: 70%; left: 8%; animation-delay: 1s; }
    .dot:nth-child(3) { top: 20%; right: 12%; animation-delay: 2s; }
    .dot:nth-child(4) { top: 80%; right: 10%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.3;
      }

      50% {
        transform: translateY(-20px);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      .message {
        margin-bottom: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Decorative dots -->
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>

  <main class="container">

    <div class="message">
      bayad po muna plsss
    </div>

    <div class="cat-frame">
      <iframe
        class="cat"
        src="https://gifdb.com/gif/cat-crying-sad-kitten-tear-drops-suvtyr43lhu661bh.html?embed=true"
        width="480"
        height="480"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>

  </main>

</body>
</html>
