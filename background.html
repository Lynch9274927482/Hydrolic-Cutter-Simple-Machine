<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Casual room background (blurred)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9a98e; }
  /* oversized so the blur never exposes the edge of the page */
  #scene { position: absolute; inset: -120px; filter: blur(18px) saturate(1.05); }
  svg { width: 100%; height: 100%; display: block; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(25,15,5,.38) 100%); }
</style>
</head>
<body>
<div id="scene">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eee3d2"/><stop offset="1" stop-color="#d2c1a7"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9dcff"/><stop offset="1" stop-color="#fffbea"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b78655"/><stop offset="1" stop-color="#7d5430"/></linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f7f80"/><stop offset=".5" stop-color="#6c9c9b"/><stop offset="1" stop-color="#4f7f80"/></linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a8aa2"/><stop offset="1" stop-color="#586579"/></linearGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#fff0c0" stop-opacity=".95"/><stop offset="1" stop-color="#fff0c0" stop-opacity="0"/></radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- wall, baseboard, floor (extends well past the visible area) -->
  <rect x="-200" y="-200" width="2000" height="1000" fill="url(#wall)"/>
  <rect x="-200" y="660" width="2000" height="26" fill="#f4eee4"/>
  <rect x="-200" y="686" width="2000" height="400" fill="url(#floor)"/>
  <g stroke="#5f3f22" stroke-opacity=".25" stroke-width="3">
    <path d="M-200 740H1800M-200 800H1800M-200 870H1800"/><path d="M200 686v400M620 686v400M1040 686v400M1460 686v400"/>
  </g>

  <!-- window with daylight + curtains -->
  <rect x="1040" y="110" width="380" height="370" fill="#fbf8f1"/>
  <rect x="1058" y="128" width="344" height="334" fill="url(#sky)"/>
  <rect x="1224" y="128" width="12" height="334" fill="#fbf8f1"/><rect x="1058" y="288" width="344" height="12" fill="#fbf8f1"/>
  <ellipse cx="1130" cy="200" rx="55" ry="24" fill="#fff" opacity=".85"/><ellipse cx="1330" cy="380" rx="70" ry="26" fill="#fff" opacity=".7"/>
  <rect x="1000" y="92" width="460" height="10" rx="5" fill="#4a3a2a"/>
  <path d="M1010 100h90v420q-45 20-90 0z" fill="url(#curtain)"/><path d="M1360 100h90v420q-45 20-90 0z" fill="url(#curtain)"/>
  <g stroke="#3b6668" stroke-opacity=".5" stroke-width="3"><path d="M1035 100v415M1060 100v420M1385 100v420M1410 100v415"/></g>
  <polygon points="1058,462 1402,462 1300,700 900,700" fill="url(#ray)"/>

  <!-- gallery frames above the sofa -->
  <rect x="170" y="150" width="150" height="190" fill="#3a2d22"/><rect x="182" y="162" width="126" height="166" fill="#f2d7a1"/><circle cx="245" cy="225" r="34" fill="#d9573b"/><path d="M182 328l50-70 40 40 36-30v60z" fill="#4c8c6a"/>
  <rect x="345" y="130" width="210" height="140" fill="#f4efe6"/><rect x="357" y="142" width="186" height="116" fill="#9ec5d6"/><path d="M357 258l60-60 50 40 40-50 36 70z" fill="#375a7a"/>
  <rect x="345" y="290" width="100" height="100" fill="#f4efe6"/><rect x="355" y="300" width="80" height="80" fill="#e9b44c"/><rect x="455" y="290" width="100" height="100" fill="#2f2f33"/><circle cx="505" cy="340" r="26" fill="#f4efe6"/>

  <!-- wall clock -->
  <circle cx="800" cy="190" r="52" fill="#2c2c2f"/><circle cx="800" cy="190" r="44" fill="#f7f4ee"/><path d="M800 190v-30M800 190l24 12" stroke="#222" stroke-width="5" stroke-linecap="round"/>

  <!-- sofa with cushions -->
  <rect x="100" y="470" width="560" height="170" rx="40" fill="url(#sofa)"/>
  <rect x="70" y="540" width="120" height="150" rx="36" fill="#66758c"/><rect x="570" y="540" width="120" height="150" rx="36" fill="#66758c"/>
  <rect x="180" y="580" width="400" height="100" rx="22" fill="#8b9bb3"/>
  <rect x="215" y="500" width="110" height="110" rx="18" fill="#e3a93f" transform="rotate(-8 270 555)"/>
  <rect x="430" y="505" width="110" height="105" rx="18" fill="#f1ece0" transform="rotate(7 485 557)"/>
  <rect x="115" y="680" width="22" height="30" fill="#3b2a1b"/><rect x="620" y="680" width="22" height="30" fill="#3b2a1b"/>
  <path d="M250 590q60 30 140 10l-20 70q-60 20-130 0z" fill="#d86c4a" opacity=".9"/>  <!-- throw blanket -->

  <!-- potted plant -->
  <rect x="725" y="590" width="80" height="100" rx="10" fill="#c1633c"/>
  <g fill="#3f9b4f"><ellipse cx="740" cy="520" rx="22" ry="70" transform="rotate(-25 740 560)"/><ellipse cx="770" cy="490" rx="22" ry="80"/><ellipse cx="800" cy="520" rx="22" ry="70" transform="rotate(25 800 560)"/><ellipse cx="715" cy="560" rx="18" ry="50" transform="rotate(-50 720 590)" fill="#2f7f40"/><ellipse cx="825" cy="560" rx="18" ry="50" transform="rotate(50 820 590)" fill="#2f7f40"/></g>

  <!-- floor lamp -->
  <circle cx="900" cy="330" r="170" fill="url(#lamp)"/>
  <rect x="893" y="360" width="14" height="320" fill="#3a3330"/><path d="M850 370l25-80h50l25 80z" fill="#f6e7c4"/><rect x="860" y="676" width="80" height="12" rx="6" fill="#3a3330"/>

  <!-- bookshelf on the right -->
  <rect x="1470" y="260" width="200" height="420" fill="#8a6540"/>
  <rect x="1480" y="270" width="180" height="120" fill="#6f4f30"/><rect x="1480" y="400" width="180" height="120" fill="#6f4f30"/><rect x="1480" y="530" width="180" height="140" fill="#6f4f30"/>
  <g><rect x="1490" y="290" width="22" height="100" fill="#c0392b"/><rect x="1514" y="300" width="18" height="90" fill="#2d6cdf"/><rect x="1534" y="285" width="24" height="105" fill="#e9b44c"/><rect x="1562" y="310" width="20" height="80" fill="#27ae60"/><rect x="1586" y="295" width="26" height="95" fill="#8e44ad"/>
    <rect x="1495" y="440" width="60" height="80" rx="6" fill="#ecf0f1"/><circle cx="1600" cy="480" r="30" fill="#e67e22"/>
    <rect x="1495" y="560" width="120" height="110" fill="#caa66b"/><ellipse cx="1630" cy="560" rx="22" ry="40" fill="#3f9b4f"/></g>

  <!-- rug -->
  <ellipse cx="760" cy="820" rx="560" ry="80" fill="#b5523b"/><ellipse cx="760" cy="820" rx="500" ry="62" fill="none" stroke="#f1e2c4" stroke-width="10"/><ellipse cx="760" cy="820" rx="400" ry="44" fill="none" stroke="#2f4f5f" stroke-width="8"/>

  <!-- soft bokeh highlights -->
  <g fill="#fff" opacity=".25"><circle cx="640" cy="320" r="24"/><circle cx="980" cy="560" r="30"/><circle cx="1260" cy="560" r="22"/><circle cx="420" cy="740" r="34"/><circle cx="1330" cy="740" r="28"/></g>
</svg>
</div>
<div id="vignette"></div>
</body>
</html>
